<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B3A63">
<title>EasyTailor</title>
<script>
  /* Capture l'invite d'installation le plus tôt possible : ce signal peut arriver
     avant que app.js (fichier volumineux) ait fini de se charger, et une fois raté
     il est perdu pour de bon — l'app retombe alors sur les instructions manuelles. */
  window.__deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    window.__deferredInstallPrompt = e;
    window.dispatchEvent(new Event('__installPromptReady'));
  });
</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash-screen" class="splash-screen">
  <img src="icons/logo-full.png" alt="EasyTailor" class="splash-logo">
  <div class="splash-footer">PAR KINVOS</div>
</div>

<div class="tape-strip" aria-hidden="true"></div>

<button id="btn-install-app" class="install-fab" style="display:none;">⬇️ Télécharger l'application</button>

<header class="app-header">

    <img src="icons/icon-192.png" alt="EasyTailor" class="brand-mark" width="36" height="36">
    <div class="brand-text">
      <h1>Easy<span class="brand-accent">Tailor</span></h1>
      <p>Atelier &amp; mesures</p>
    </div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="btn-search" aria-label="Rechercher une cliente">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M10 3a7 7 0 1 0 4.32 12.53l5.08 5.08 1.41-1.41-5.08-5.08A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z" fill="currentColor"/></svg>
    </button>
    <button class="icon-btn" id="btn-parametres" aria-label="Réglages">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.6.24-1.15.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.61 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.05.3-.08.63-.08.94s.02.64.07.94L2.72 14.5a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.66.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.6-.24 1.13-.56 1.62-.94l2.39.96c.24.1.52.02.66-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<main id="view-root" class="view-root"></main>

<nav class="tab-bar" aria-label="Navigation principale">
  <button class="tab-btn active" data-view="dashboard">
    <span class="tab-icon-wrap"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 13h6V4H4v9zm0 7h6v-5H4v5zm10 0h6V11h-6v9zm0-16v5h6V4h-6z" fill="currentColor"/></svg></span>
    <span>Accueil</span>
  </button>

    <span>Catalogue</span>
  </button>
  <button class="tab-btn" data-view="apprentis">
    <span class="tab-icon-wrap"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z" fill="currentColor"/></svg></span>
    <span>Apprentis</span>
  </button>
  <button class="tab-btn" data-view="parametres">
    <span class="tab-icon-wrap"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.6.24-1.15.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.61 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.05.3-.08.63-.08.94s.02.64.07.94L2.72 14.5a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.66.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.6-.24 1.13-.56 1.62-.94l2.39.96c.24.1.52.02.66-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z" fill="currentColor"/></svg></span>
    <span>Réglages</span>
  </button>
</nav>

<div id="print-area"></div>

<div class="modal-backdrop" id="modal-backdrop"></div>
<div class="modal" id="modal"></div>

<div class="license-lock open" id="license-lock"></div>

<script src="app.js"></script>
</body>
</html>
